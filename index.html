<!doctype html>
<html lang="en">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta charset="utf-8">
<title>Fix That Office</title>
<link rel="icon" href="logo.png">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --surface-2:#F7F9FC; --ink:#15233A; --muted:#5A6576; --line:#DCE2EA;
  --navy:#1F4575; --navy-ink:#FFFFFF; --accent:#F36A22; --accent-ink:#FFFFFF; --accent-soft:#FEF0E7;
  --mid:#36649D; --sage:#CEDBD7;
  --good:#1E7A4C; --good-soft:#E3F3EA; --warn:#A76100; --warn-soft:#FDF1DC; --bad:#B42318; --bad-soft:#FDE8E6;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:"Source Sans 3","Segoe UI",Arial,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme:dark;
  --bg:#0E1624; --surface:#16213A; --surface-2:#1B2843; --ink:#E7EDF5; --muted:#A3AFC2; --line:#2A3A58;
  --navy:#17355C; --navy-ink:#F4F7FB; --accent:#F5813F; --accent-soft:#3A2517;
  --good:#5CCB8F; --good-soft:#133626; --warn:#F0B35A; --warn-soft:#3A2B12; --bad:#FF8A7E; --bad-soft:#3E1B18; } }
:root[data-theme="dark"]{ color-scheme:dark;
  --bg:#0E1624; --surface:#16213A; --surface-2:#1B2843; --ink:#E7EDF5; --muted:#A3AFC2; --line:#2A3A58;
  --navy:#17355C; --navy-ink:#F4F7FB; --accent:#F5813F; --accent-soft:#3A2517;
  --good:#5CCB8F; --good-soft:#133626; --warn:#F0B35A; --warn-soft:#3A2B12; --bad:#FF8A7E; --bad-soft:#3E1B18; }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.05;text-wrap:balance}
p{margin:0}
.num{font-variant-numeric:tabular-nums}

/* Shell */
.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{background:var(--navy);color:var(--navy-ink);padding:18px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh}
.brand{background:#fff;border-radius:8px;padding:10px 12px;display:block;border:0;width:100%;cursor:pointer;font:inherit} .brand:hover{box-shadow:0 0 0 3px var(--accent)}
.brand img{display:block;width:100%;height:auto}
.brand-sub{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.75;margin-top:-8px;padding-left:2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:6px;font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:.03em;text-transform:uppercase;opacity:.85;white-space:nowrap}
.nav button:hover{background:rgba(255,255,255,.08);opacity:1}
.nav button[aria-current="page"]{background:rgba(255,255,255,.14);opacity:1;box-shadow:inset 3px 0 0 var(--accent)}
.nav .count{font-family:var(--mono);font-size:11px;background:var(--accent);color:#fff;border-radius:10px;padding:1px 7px}
.side .newlead{margin-top:auto}
.main{padding:22px 28px 60px;min-width:0}
.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.topline h1{font-size:40px;font-weight:800;text-transform:uppercase}
.crumb{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.crumb button{all:unset;cursor:pointer;color:var(--accent)}
.savestate{font-family:var(--mono);font-size:12px;color:var(--muted)}
.banner{background:var(--warn-soft);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent);padding:10px 14px;border-radius:6px;margin-bottom:16px;font-weight:600}

/* Controls */
.btn{display:inline-flex;align-items:center;gap:6px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:6px;font-weight:600;font-size:14px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--mid)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.navy{background:var(--navy);border-color:var(--navy);color:var(--navy-ink)}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.bad{color:var(--bad)}
.btn.small{padding:5px 10px;font-size:13px}
.btn.block{width:100%;justify-content:center}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,.nav button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.linkish:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 60%,transparent);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
label.f{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
label.f > span{text-transform:uppercase;letter-spacing:.05em;font-size:11.5px}
input[type=text],input[type=tel],input[type=email],input[type=number],input[type=date],input[type=time],input[type=url],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;color:var(--ink);font-weight:400;font-size:15px;min-width:0}
textarea{resize:vertical;min-height:70px}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);vertical-align:middle}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.linkish{all:unset;cursor:pointer;color:var(--mid);font-weight:600}
.linkish:hover{text-decoration:underline}
:root:not([data-theme="light"]) .linkish{color:color-mix(in srgb,var(--mid) 40%,#fff)}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px 18px}
.card h2{font-size:24px;font-weight:700;text-transform:uppercase;margin-bottom:10px}
.card h3{font-size:19px;font-weight:700;text-transform:uppercase}
.stack{display:grid;gap:16px;align-content:start}
.cols{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.kpi .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.kpi .val{font-family:var(--display);font-size:38px;font-weight:800;line-height:1.05;margin-top:4px}
.kpi .sub{font-size:13px;color:var(--muted)}
.delta.up{color:var(--good)} .delta.down{color:var(--bad)}
.muted{color:var(--muted)}
.small{font-size:13px}
.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px}

/* Pills */
.pill{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.lead{background:#E7EEF8;color:#1F4575;border-color:#C9D7EC}
.pill.sent{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.won{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.lost{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.orange{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pill.gray{opacity:.8}
:root:not([data-theme="light"]) .pill.lead{background:#1D3355;color:#BCD0EE;border-color:transparent}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]) .pill.lead{background:#E7EEF8;color:#1F4575} }

/* Attention list */
.att{display:grid;gap:8px}
.att-item{display:grid;grid-template-columns:6px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px 10px 0}
.att-item .stripe{align-self:stretch;border-radius:6px 0 0 6px;background:var(--mid)}
.att-item.bad .stripe{background:var(--bad)} .att-item.warn .stripe{background:var(--accent)} .att-item.good .stripe{background:var(--good)}
.att-item .t{font-weight:700}
.att-item .d{font-size:13px;color:var(--muted)}

/* Tables */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}
tr.archived td{opacity:.55}
td.r,th.r{text-align:right}
td input,td select{padding:6px 8px;font-size:14px}

/* Pipeline */
.board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.colm{background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;gap:8px;align-content:start;min-height:120px}
.colm h3{font-size:17px;font-weight:700;text-transform:uppercase;display:flex;justify-content:space-between;align-items:baseline}
.colm h3 .num{font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:500}
.qcard{all:unset;cursor:pointer;display:grid;gap:3px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.qcard:hover{border-color:var(--mid)}
.qcard.archived{opacity:.55}
.qcard .n{font-weight:700}
.qcard .m{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}

/* Tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{all:unset;cursor:pointer;padding:8px 14px;font-family:var(--display);font-size:18px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* Margin panel */
.margin{display:grid;gap:6px}
.margin .ln{display:flex;justify-content:space-between;gap:8px}
.margin .big{font-family:var(--display);font-size:44px;font-weight:800;line-height:1}
.m-good{color:var(--good)} .m-warn{color:var(--warn)} .m-bad{color:var(--bad)}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar > i{display:block;height:100%}

/* Steps (handoff) */
.steps{display:grid;gap:12px}
.step{display:grid;grid-template-columns:36px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.step .dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:18px;background:var(--surface-2);border:2px solid var(--line);color:var(--muted)}
.step.done .dot{background:var(--good);border-color:var(--good);color:#fff}
.step.now{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.step.now .dot{background:var(--accent);border-color:var(--accent);color:#fff}
.step h3{font-size:20px;margin-bottom:6px}
.msg{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:10px 12px;white-space:pre-wrap;font-size:14px}

/* Reports */
.hbar{display:grid;grid-template-columns:150px 1fr 80px;gap:10px;align-items:center;font-size:14px}
.hbar .track{height:20px;background:var(--surface-2);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.hbar .track i{display:block;height:100%}
.vbars{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;align-items:end;height:200px;padding-top:24px}
.vbars .b{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px}
.vbars .b i{display:block;width:70%;background:var(--mid);border-radius:4px 4px 0 0;min-height:2px}
.vbars .b.cur i{background:var(--accent)}
.vbars .b span{font-size:12px;color:var(--muted);font-family:var(--mono)}
.vbars .b b{font-size:12px;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{all:unset;cursor:pointer;padding:7px 12px;font-weight:600;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink)}

/* Calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--line);gap:1px}
.cal-h{background:var(--surface-2);font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:6px 8px}
.cal-d{background:var(--surface);min-height:104px;padding:6px;display:flex;flex-direction:column;gap:4px;min-width:0}
.cal-d.out{background:var(--surface-2)} .cal-d.out .cal-n span:first-child{opacity:.45}
.cal-d.today .cal-n span:first-child{background:var(--accent);color:#fff;border-radius:10px;padding:0 7px}
.cal-d.pickable{cursor:pointer} .cal-d.pickable:hover{box-shadow:inset 0 0 0 2px var(--accent)}
.cal-n{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:13px}
.cal-hrs{font-family:var(--mono);font-size:10.5px;color:var(--muted);font-weight:500} .cal-hrs.over{color:var(--bad);font-weight:700}
.drag{cursor:grab;color:var(--muted);padding:2px 3px;user-select:none} .drag:active{cursor:grabbing} tr.dragover td{box-shadow:inset 0 2px 0 var(--accent)} .mv{display:inline-flex;flex-direction:column;vertical-align:middle} .mv button{padding:0 3px;font-size:11px;line-height:1.1;color:var(--mid)} .mv button[disabled]{opacity:.25}
.thumbs{display:flex;flex-wrap:wrap;gap:8px} .thumb{position:relative;width:96px;height:96px;border-radius:6px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2)} .thumbs.sm .thumb{width:44px;height:44px} .thumb img{width:100%;height:100%;object-fit:cover;display:block} .thumb .pdf{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;font-weight:700;font-size:13px;color:var(--mid);text-decoration:none;text-align:center} .thumb .pdf span{font-weight:400;font-size:10px} .thumbs.sm .pdf span{display:none} .thumb .tk{position:absolute;left:0;bottom:0;background:rgba(0,0,0,.6);color:#fff;font-size:10px;padding:1px 5px;border-top-right-radius:4px} .thumb .tx{position:absolute;top:2px;right:2px;border:0;border-radius:50%;width:20px;height:20px;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;line-height:1}
.wk-wrap{overflow-x:auto} .wk{display:grid;gap:0 6px;min-width:760px} .wk-h{font-size:13px;padding:4px 6px;border-bottom:2px solid var(--line)} .wk-h.today{border-bottom-color:var(--accent)} .wk-ln{display:flex;justify-content:space-around;font-size:10px;font-weight:700}
.wk-t{position:relative} .wk-t span{position:absolute;right:4px;font-size:10px;color:var(--muted);transform:translateY(-1px)}
.wk-d{position:relative;background:repeating-linear-gradient(to bottom,transparent 0 33px,var(--line) 33px 34px);border-radius:4px} .wk-d.past{opacity:.55} .wk-lane{position:absolute;top:0;bottom:0;padding:0 1px}
.wk-b,.wk-o{all:unset;box-sizing:border-box;position:absolute;left:1px;right:1px;border-radius:5px;padding:2px 5px;font-size:11px;line-height:1.25;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;text-align:left}
.wk-b{background:color-mix(in srgb,var(--cc) 22%,var(--surface));border-left:4px solid var(--cc);color:var(--ink)} .wk-b.visit{background:color-mix(in srgb,#8a6bb8 22%,var(--surface));border-left-color:#8a6bb8} .wk-b.done{opacity:.6}
.wk-b .z{font-family:var(--mono);font-size:10px;font-weight:700} .wk-b .top{display:flex;justify-content:space-between;gap:4px} .wk-b .n,.wk-o .n{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk-o{background:color-mix(in srgb,var(--good) 12%,var(--surface));border:1px dashed var(--good);color:var(--good)} .wk-o:hover{background:color-mix(in srgb,var(--good) 24%,var(--surface))} .wk-o[disabled]{cursor:default;opacity:.5}
.wk-z{padding:6px 2px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:3px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 8px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink);white-space:nowrap}
.tag.mine{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:700} .tag button{all:unset;cursor:pointer;font-weight:700;padding:0 2px}
button.tag.pick{cursor:pointer;font:inherit;font-size:12px} button.tag.pick .num{color:var(--muted);font-size:11px} button.tag.pick.on{background:var(--navy,#1F4575);color:#fff;border-color:transparent} button.tag.pick.on .num{color:#cfd8e6}
.steps,.step>div,.cols>*,.stack>*{min-width:0} .step{min-width:0} .grid2,.grid3{min-width:0}
@media (max-width:900px){.cols{grid-template-columns:minmax(0,1fr)!important}} .seg{flex-wrap:wrap;max-width:100%}
.maplink{color:var(--mid);font-weight:600;text-decoration:underline;text-underline-offset:2px} .maplink:hover{color:var(--accent)}
.cal-j{all:unset;cursor:pointer;display:block;font-size:12px;font-weight:700;line-height:1.25;padding:4px 6px;border-radius:4px;border-left:3px solid var(--mid);background:var(--surface-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-j span{display:block;font-weight:400;color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.cal-j.ok{border-left-color:var(--good);background:var(--good-soft)} .cal-j.tbc{border-left-color:var(--accent);background:var(--accent-soft)} .cal-j.done{opacity:.6}
.cal-j:focus-visible{outline:2px solid var(--accent)}
.cal-m{font-size:11px;font-weight:600;padding:2px 6px;border-radius:4px;background:#E7EEF8;color:#1F4575;border-left:3px solid var(--mid);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
:root:not([data-theme="light"]) .cal-m{background:#1D3355;color:#BCD0EE}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .cal-m{background:#E7EEF8;color:#1F4575}}
.cal-d.samezip{box-shadow:inset 0 0 0 2px var(--good)}
.cal-d.early{background:repeating-linear-gradient(135deg,var(--surface) 0 8px,var(--surface-2) 8px 16px)}
.lg.mat{background:var(--mid)} .lg.est{background:#8a6bb8} .cal-j.est{border-left-color:#8a6bb8;background:rgba(138,107,184,.14)}
.lg{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:middle;margin-right:4px}
.lg.ok{background:var(--good)} .lg.tbc{background:var(--accent)} .lg.done{background:var(--muted)}
@media (max-width:900px){.cal-m{display:none}.cal-d{min-height:70px;padding:3px}.cal-j{font-size:10.5px;padding:2px 4px}.cal-j span{display:none}.cal-hrs{display:none}}

/* Dupes */
.dupe{border:1px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:12px 14px;display:grid;gap:8px}
.dupe .it{display:flex;justify-content:space-between;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px}

/* Toast + modal */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;font-weight:600;z-index:50;max-width:90vw}
.modal{position:fixed;inset:0;background:rgba(10,18,30,.55);display:grid;place-items:center;z-index:40;padding:16px}
.modal .box{background:var(--surface);border-radius:10px;padding:18px;width:min(560px,100%);display:grid;gap:12px;max-height:90vh;overflow:auto}
.modal textarea{min-height:170px}

.note-log{display:grid;gap:6px;max-height:260px;overflow:auto}

<script>
(function(){
"use strict";

/* ---------- Constants ---------- */
const TOWNS=["Eden","Liberty","Huntsville","North Ogden","Pleasant View","Farr West","Plain City","West Weber","Taylor","West Haven","Hooper","Warren","Other"];
const CUST_TYPES=["Homeowner","Property manager","Business"];
const CONSENT_METHODS=["Verbal, on a call","In person","Text reply","Email","Web form","Signed / written"];
const CH={call:"Call",text:"Text",email:"Email",vm:"Recorded voicemail"};const CHS=["call","text","email","vm"];
function canRemind(c){return CHS.slice(1).some(ch=>(consentOf(c,ch)||{}).ok)}
const ST={lead:"Draft",sent:"Sent",won:"Approved",lost:"Lost"};
const LOST_REASONS=["Price","Went with someone else","Timing","No response","Doing it themselves","Other"];
const DEFAULTS={
  winbackMonths:5,followUpDays:5,
  requireChangeApproval:true,
  dayStart:"08:00",dayEnd:"17:00",visitHrs:1,
  expenseCats:["Materials & supplies","Subcontractors","Equipment rental","Tools & equipment","Vehicle: fuel","Vehicle: repairs & upkeep","Dump & disposal fees","Permits & licenses","Insurance","Advertising & marketing","Office, software & phone","Meals","Other"],
  trendCount:2,trendDays:90,
  crew:[{id:"seth",name:"Seth",color:"#36649D"}],
  lostReasons:["Price","Went with someone else","Timing","No response","Doing it themselves","Decided not to do it"],
  jobTypes:["Multiple repairs","Doors & Windows","Drywall & Paint","Flooring","Tile & Backsplash","Carpentry & Trim","Mounting & Installs","Fixture Repairs","Outdoor & Fences","Other"],
  sources:["Google","Facebook / Nextdoor","Referral","Website","Repeat customer","Other"],
  vendors:["Home Depot","Lowe's","Amazon","Other"],
  laborRate:40, defaultDeposit:50, phone:"(801) 917-4442", reviewLink:"", company:"Yes, I Can Fix That", terms:""
};

/* ---------- State ---------- */
const S={customers:{},leads:{},expenses:{},quotes:{},jobs:{},settings:Object.assign({},DEFAULTS),
  loaded:{customers:false,leads:false,expenses:false,quotes:false,jobs:false},
  insights:null, view:{name:"dash"}, draft:null, draftColl:null, dirty:false, ui:{qtab:"customer",range:"30",custQ:"",quoteQ:"",leadQ:"",intake:null}};
let assetsFn=null, db=null, dbState="loading", readOnly=false, sampleFn=null, checkCtl=null, dlFn=null;

/* ---------- Helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const money=n=>{n=+n||0;return (n<0?"-":"")+"$"+Math.abs(n).toLocaleString("en-US",{maximumFractionDigits:0})};
const money2=n=>"$"+(+n||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const pct=n=>(isFinite(n)?Math.round(n):0)+"%";
const digits=s=>String(s||"").replace(/\D/g,"");
function todayStr(off){const d=new Date();if(off)d.setDate(d.getDate()+off);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function parseD(s){if(!s)return null;const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function fmtD(s){const d=parseD(s);return d?d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"}):""}
function fmtT(ms){if(!ms)return "";return new Date(ms).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric"})}
function daysSince(ms){return ms?Math.floor((Date.now()-ms)/864e5):0}
function ago(ms){const d=daysSince(ms);return d<=0?"today":d===1?"1 day ago":d+" days ago"}
function custName(c){return c?((c.first||"")+" "+(c.last||"")).trim()||c.company||"Unnamed":"Unknown customer"}
function consentOf(c,ch){const x=c&&c.consent&&c.consent[ch];if(!x){if(ch==="text"&&c&&c.optedOut)return {ok:false};return null}return x}
function consentPill(c,ch){const x=consentOf(c,ch);return x==null?`<span class="pill">${CH[ch]}: not asked</span>`:x.ok?`<span class="pill won">${CH[ch]}: yes</span>`:`<span class="pill lost">${CH[ch]}: no</span>`}
function consentPills(c){return `<span class="row" style="gap:4px">${CHS.map(ch=>consentPill(c,ch)).join("")}${c&&c.id&&!canRemind(c)?'<span class="pill lost">No reminders</span>':""}</span>`}
function mapUrl(p){const a=addrLine(p)+(p&&(p.town||p.zip)?", UT":"");return "https://www.google.com/maps/dir/?api=1&destination="+encodeURIComponent(a)}
function mapLink(p,cls){if(!p||!(p.address||p.town))return "";return `<a class="${cls||"maplink"}" href="${esc(mapUrl(p))}" target="_blank" rel="noopener" title="Directions in Google Maps">📍 ${esc(addrLine(p))}</a>`}
function addrLine(p){if(!p)return "";const town=[p.town,p.zip].filter(Boolean).join(" ");return [p.address,town].filter(Boolean).join(", ")}
function nextNo(kind){const field={lead:"leadNo",quote:"quoteNo",job:"jobNo",invoice:"invoiceNo"}[kind];const src=kind==="quote"?S.quotes:kind==="lead"?S.leads:S.jobs;
  let max=1000;vals(src).forEach(x=>{const n=parseInt(String(x[field]||"").replace(/\D/g,""),10);if(n>max&&n<1e7)max=n});
  return ({lead:"L-",quote:"Q-",job:"J-",invoice:"INV-"}[kind])+(max+1)}
const qNo=q=>q&&q.quoteNo?q.quoteNo:"";const jNo=j=>j&&j.jobNo?j.jobNo:"";
function denverNow(){try{const p=new Intl.DateTimeFormat("en-US",{timeZone:"America/Denver",hour:"numeric",minute:"2-digit",hour12:false}).formatToParts(new Date());const h=+p.find(x=>x.type==="hour").value%24,m=+p.find(x=>x.type==="minute").value;return {h,m,label:new Date().toLocaleTimeString("en-US",{timeZone:"America/Denver",hour:"numeric",minute:"2-digit"})}}catch(e){return null}}
function quietBanner(){const d=denverNow();if(!d||(d.h>=8&&d.h<19))return "";return `<div class="banner" style="margin:0;background:var(--warn-soft);color:var(--warn);border-color:transparent">It's ${esc(d.label)} in Denver. Your rule: no messages before 8 AM or after 7 PM Mountain time. Save this and send it in the morning.</div>`}
function isPM(c){return c&&c.type==="Property manager"}
function firstName(c){return (c&&c.first)||"there"}
function setPath(o,path,v){const k=path.split(".");let t=o;for(let i=0;i<k.length-1;i++){const key=/^\d+$/.test(k[i])?+k[i]:k[i];if(t[key]==null)t[key]=/^\d+$/.test(k[i+1])?[]:{};t=t[key]}const last=/^\d+$/.test(k[k.length-1])?+k[k.length-1]:k[k.length-1];t[last]=v}
function getPath(o,path){return path.split(".").reduce((a,k)=>a==null?a:a[/^\d+$/.test(k)?+k:k],o)}
function opts(list,sel,blank){return (blank!=null?`<option value="">${esc(blank)}</option>`:"")+list.map(v=>`<option${v===sel?" selected":""}>${esc(v)}</option>`).join("")}
const vals=o=>Object.values(o);

function qTotals(q){
  const lines=(q.lines||[]).filter(l=>!l.removed);
  const price=q.mode==="flat"?(+q.flatPrice||0):lines.reduce((s,l)=>s+(+l.qty||0)*(+l.price||0),0);
  const mats=((q.internal&&q.internal.materials)||[]).reduce((s,m)=>s+(+m.cost||0),0);
  const labor=(+(q.internal&&q.internal.hours)||0)*(+(q.internal&&q.internal.crew)||1)*(+S.settings.laborRate||0);
  const cost=mats+labor, profit=price-cost, margin=price>0?profit/price*100:0;
  const dep=+q.depositPct||S.settings.defaultDeposit||50;
  return {price,mats,labor,cost,profit,margin,deposit:price*dep/100,dep};
}
function mClass(m){return m>=35?"m-good":m>=20?"m-warn":"m-bad"}
function mColor(m){return m>=35?"var(--good)":m>=20?"var(--accent)":"var(--bad)"}

/* ---------- Data layer ---------- */
const chains={};
function errText(e){const c=e&&e.code;
  if(c==="quota_exceeded")return "Storage is full. Delete old example or archived records to make room.";
  if(c==="invalid_argument"){readOnly=true;return "You can view this office, but your access doesn't allow changes. Ask Shauna to make you an Editor.";}
  if(c==="revoked")return "Access to this page changed. Reload to continue.";
  return "Couldn't save just now. Check your connection; your last change may not have saved.";}
function put(coll,id,data,o){
  data.id=id; S[coll][id]=data; if(!o||!o.quiet)render();
  if(!db)return Promise.resolve();
  const key=coll+"/"+id;
  const run=()=>db.doc(key).set(clone(data)).catch(e=>{if(e&&e.code==="unavailable")return new Promise(r=>setTimeout(r,800+Math.random()*800)).then(()=>db.doc(key).set(clone(data))).catch(x=>toast(errText(x)));toast(errText(e))});
  chains[key]=(chains[key]||Promise.resolve()).then(run);return chains[key];
}
function remove(coll,id){
  delete S[coll][id];render();
  if(!db)return Promise.resolve();
  const key=coll+"/"+id;
  chains[key]=(chains[key]||Promise.resolve()).then(()=>db.doc(key).delete().catch(e=>toast(errText(e))));return chains[key];
}
function saveSettings(s){S.settings=Object.assign({},DEFAULTS,s);render();if(db){const k="settings/main";chains[k]=(chains[k]||Promise.resolve()).then(()=>db.doc(k).set(clone(S.settings)).catch(e=>toast(errText(e))))}}

async function connect(){
  if(window.claude&&window.claude.use){window.claude.use("downloads").then(f=>{dlFn=f||null}).catch(()=>{});window.claude.use("assets").then(f=>{assetsFn=f||null;render()}).catch(()=>{});window.claude.use("sample").then(f=>{sampleFn=f||null;if(S.view.name==="quote")render()}).catch(()=>{})}
  let use=null;
  try{use=window.claude&&window.claude.use?await window.claude.use("db"):null}catch(e){use=null}
  if(!use){dbState="none";for(const k in S.loaded)S.loaded[k]=true;render();return}
  db=use;dbState="ready";
  ["customers","leads","quotes","jobs","expenses"].forEach(coll=>{
    db.collection(coll).onSnapshot(snap=>{
      const m={};snap.docs.forEach(d=>{const x=d.data();if(x)m[d.id]=Object.assign({},x,{id:d.id})});
      S[coll]=m;S.loaded[coll]=true;scheduleRender();
    },e=>{S.loaded[coll]=true;toast(errText(e));render()});
  });
  db.doc("meta/insights").onSnapshot(s=>{if(s.exists)S.insights=s.data();scheduleRender()},()=>{});
  db.doc("settings/main").onSnapshot(s=>{if(s.exists)S.settings=Object.assign({},DEFAULTS,s.data());scheduleRender()},()=>{});
}
let rq=false;function scheduleRender(){if(rq)return;rq=true;requestAnimationFrame(()=>{rq=false;render()})}

/* ---------- Draft editing (autosave) ---------- */
let saveTimer=null;
function openDraft(coll,id){flush();S.draftColl=coll;S.draft=S[coll][id]?clone(S[coll][id]):null;S.dirty=false}
function touch(){if(!S.draft)return;S.dirty=true;setSave("Saving…");clearTimeout(saveTimer);saveTimer=setTimeout(flush,900)}
function flush(){clearTimeout(saveTimer);if(!S.dirty||!S.draft)return;S.dirty=false;const d=clone(S.draft);d.updatedAt=Date.now();S.draft.updatedAt=d.updatedAt;put(S.draftColl,d.id,d,{quiet:true}).then(()=>setSave("All changes saved"))}
function setSave(t){const el=$("#savestate");if(el)el.textContent=t}
window.addEventListener("pagehide",flush);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")flush()});

/* ---------- Navigation ---------- */
function go(name,id,extra){
  flush();
  S.view=Object.assign({name,id},extra||{});
  if(name==="quote"){openDraft("quotes",id);S.ui.qtab="customer"}
  else if(name==="customer")openDraft("customers",id);
  else if(name==="job"){if(S.draft&&S.draft.id!==id||S.draftColl!=="jobs")S.ui.jtab=(extra&&extra.jtab)||"front";openDraft("jobs",id)}
  else if(name==="lead")openDraft("leads",id);
  else {S.draft=null;S.draftColl=null}
  if(name==="intake"&&!S.ui.intake)S.ui.intake={type:"Homeowner",company:"",first:"",last:"",phone:"",email:"",source:"",referredBy:"",address:"",town:"",zip:"",onsiteName:"",onsitePhone:"",jobType:"",description:"",timing:"",customerId:"",propertyId:"",consent:{call:false,text:false,email:false,vm:false},consentMethod:""};
  render();window.scrollTo(0,0);
}

/* ---------- Derived ---------- */
function jobStage(j,raw){
  if(!raw&&j.hold&&!j.paidFull)return "hold";
  const q=S.quotes[j.quoteId];const mats=(q&&q.internal&&q.internal.materials)||[];
  if(j.completed){if(!j.invoiced)return "invoice";if(!j.reviewRequested)return "review";return "done"}
  if(!j.noMaterials&&mats.some(m=>!m.ordered))return "order";
  if(!j.scheduledDate)return "schedule";
  if(!j.confirmed)return "confirm";
  return "scheduled";
}
const STAGES={order:["Order materials","warn"],schedule:["Ready to schedule","warn"],confirm:["Send appointment","warn"],scheduled:["Scheduled","good"],hold:["On hold: invoice needs changes","warn"],invoice:["Invoice in QuickBooks","warn"],review:["Send to NiceJob","warn"],done:["Done","good"]};
function latestEta(q){const m=((q&&q.internal&&q.internal.materials)||[]).map(x=>x.eta).filter(Boolean).sort();return m[m.length-1]||""}
function nextAvailable(q){
  let d=todayStr(1);const eta=latestEta(q);
  if(eta&&eta>=d){const x=parseD(eta);x.setDate(x.getDate()+1);d=x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")}
  let x=parseD(d);while(x.getDay()===0||x.getDay()===6)x.setDate(x.getDate()+1);
  return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");
}
/* ---------- Scheduling: times, multi-day, crew ---------- */
const CREW_COLORS=["#36649D","#F36A22","#2E8B57","#8A6BB8","#C0392B","#B8860B","#0E8C8C","#6B7280"];
function crewList(){return S.settings.crew&&S.settings.crew.length?S.settings.crew:DEFAULTS.crew}
function crewById(id){return crewList().find(c=>c.id===id)}
function jobCrew(j){const ids=j&&j.crew&&j.crew.length?j.crew:[crewList()[0].id];const l=ids.map(crewById).filter(Boolean);return l.length?l:[crewList()[0]]}
function ymdAdd(k,n){const d=parseD(k);d.setDate(d.getDate()+n);return ymd(d)}
function isWknd(k){const w=parseD(k).getDay();return w===0||w===6}
function jobDays(j){if(!j||!j.scheduledDate)return [];const end=j.endDate&&j.endDate>=j.scheduledDate?j.endDate:j.scheduledDate;const out=[];let k=j.scheduledDate,g=0;
  while(k<=end&&g++<90){if(k===j.scheduledDate||j.skipWeekends===false||!isWknd(k))out.push(k);k=ymdAdd(k,1)}return out}
const tNum=t=>{if(!t)return null;const [h,m]=t.split(":").map(Number);return h+(m||0)/60};
function tm(t){if(!t)return "";const [h,m]=t.split(":").map(Number);return (h%12||12)+(m?":"+String(m).padStart(2,"0"):"")+" "+(h>=12?"PM":"AM")}
function tmS(t){if(!t)return "";const [h,m]=t.split(":").map(Number);return (h%12||12)+(m?":"+String(m).padStart(2,"0"):"")+(h>=12?"p":"a")}
function dayHrs(j){const a=tNum(j.startTime),b=tNum(j.endTime);if(a!=null&&b!=null&&b>a)return b-a;const q=S.quotes[j.quoteId];const h=+(q&&q.internal&&q.internal.hours)||0;const n=jobDays(j).length||1;return h?Math.round(h/n*10)/10:0}
function whenText(j){const days=jobDays(j);if(!days.length)return "[date]";
  const time=j.startTime&&j.endTime?`${tm(j.startTime)} to ${tm(j.endTime)}`:j.startTime?`starting at ${tm(j.startTime)}`:"";
  if(days.length===1)return fmtD(days[0])+(time?", "+time:"");
  return `${fmtD(days[0])} through ${fmtD(days[days.length-1])} (${days.length} work days)${time?", "+time+" each day":""}`}
function suggestTimes(q){const h=+(q&&q.internal&&q.internal.hours)||0;const crew=Math.max(1,+(q&&q.internal&&q.internal.crew)||1);const per=h/crew;
  if(!per)return {startTime:"08:00",endTime:"16:00",workDays:1};
  if(per<=8){const e=8+Math.ceil(per*2)/2;const hh=Math.floor(e),mm=e%1?"30":"00";return {startTime:"08:00",endTime:String(hh).padStart(2,"0")+":"+mm,workDays:1}}
  return {startTime:"08:00",endTime:"16:00",workDays:Math.ceil(per/8)}}
function endForDays(start,n,skip){let k=start,c=1,g=0;while(c<n&&g++<90){k=ymdAdd(k,1);if(skip===false||!isWknd(k))c++}return k}
function conflicts(j){const days=jobDays(j);const mine=new Set(jobCrew(j).map(c=>c.id));const out=[];
  vals(S.jobs).forEach(o=>{if(o.id===j.id||o.completed||!o.scheduledDate)return;const shared=jobCrew(o).filter(c=>mine.has(c.id));if(!shared.length)return;const od=new Set(jobDays(o));
    days.forEach(d=>{if(!od.has(d))return;const a1=tNum(j.startTime),b1=tNum(j.endTime),a2=tNum(o.startTime),b2=tNum(o.endTime);const overlap=a1==null||b1==null||a2==null||b2==null||(a1<b2&&a2<b1);if(overlap)out.push({d,o,who:shared.map(c=>c.name).join(", ")})})});
  vals(S.leads).forEach(l=>{if(leadSt(l)!=="scheduled"||!l.visitDate||!days.includes(l.visitDate))return;out.push({d:l.visitDate,lead:l,who:"Estimate visit"})});
  return out}
function conflictHtml(list){if(!list.length)return "";return `<div class="banner" style="margin:8px 0 0;background:var(--warn-soft);color:var(--warn);border-color:transparent"><b>Already booked:</b><br>${list.slice(0,6).map(x=>x.lead?`${fmtD(x.d)}: estimate visit, ${esc(custName(S.customers[x.lead.customerId]))}${x.lead.visitTime?" "+esc(x.lead.visitTime):""}`:`${fmtD(x.d)}: ${esc(x.who)} on ${esc(custName(S.customers[x.o.customerId]))}${x.o.startTime?" "+tmS(x.o.startTime)+"–"+tmS(x.o.endTime):""}`).join("<br>")}</div>`}
function crewPicker(sel,act){return `<div class="row" style="gap:6px 14px">${crewList().map(c=>`<label class="row small" style="font-weight:600"><input type="checkbox" data-act="${act}" data-id="${esc(c.id)}"${sel.includes(c.id)?" checked":""}> <i class="lg" style="background:${esc(c.color)}"></i>${esc(c.name)}</label>`).join("")}</div>`}
function schedFields(x,bindAttr){const b=f=>bindAttr==="bind"?`data-bind="${f}" data-rerender="1"`:`data-sched="${f}"`;
  return `<div class="grid2">
    <label class="f"><span>First day</span><input type="date" ${b("scheduledDate")} value="${esc(x.scheduledDate||"")}"></label>
    <label class="f"><span>Last day</span><input type="date" ${b("endDate")} value="${esc(x.endDate||x.scheduledDate||"")}" min="${esc(x.scheduledDate||"")}"></label>
    <label class="f"><span>Start time</span><input type="time" step="900" ${b("startTime")} value="${esc(x.startTime||"")}"></label>
    <label class="f"><span>End time</span><input type="time" step="900" ${b("endTime")} value="${esc(x.endTime||"")}"></label></div>
    <label class="row small" style="margin-top:8px"><input type="checkbox" ${bindAttr==="bind"?'data-bind="skipWeekends" data-rerender="1"':'data-sched="skipWeekends"'}${x.skipWeekends===false?"":" checked"}> Skip Saturdays and Sundays</label>
    <div style="margin-top:10px"><div class="small" style="font-weight:700;margin-bottom:4px">Who's on it</div>${crewPicker(x.crew&&x.crew.length?x.crew:[crewList()[0].id],bindAttr==="bind"?"crewTog":"schedCrew")}</div>
    ${x.scheduledDate?`<p class="small" style="margin-top:8px"><b>Blocks out:</b> ${esc(whenText(x))}${jobDays(x).length?` · ${dayHrs(x)} hrs a day`:""}</p>`:""}`}
function schedModal(){const x=S.ui.sched;if(!x)return;const q=S.quotes[x.quoteId]||{};const c=S.customers[q.customerId]||{};

function attention(){

  {const M=+S.settings.winbackMonths||5;const run=S.settings.winbackRunAt;const n=winbackList().filter(x=>x.ok).length;if(n&&(!run||daysSince(run)>=M*30.44))out.push({lvl:"warn",t:`Time for the ${M}-month win-back texts`,d:`${n} past customer${n>1?"s":""} haven't booked in ${M}+ months${run?" · last run "+fmtT(run):""}`,act:"winback",id:"",btn:"Open list",sort:0})}

  vals(S.leads).forEach(l=>{const c=S.customers[l.customerId];if(c&&c.archived)return;const st=leadSt(l);

/* Pipeline */

  +`<div class="row" style="margin-bottom:14px">${actions}<button class="btn" data-act="dupQuote">Duplicate</button><button class="btn" data-act="tplOpen">Save as template</button><button class="btn" data-act="go" data-view="customer" data-id="${esc(q.customerId)}">Customer record</button><button class="btn bad" data-act="delQuote">Delete</button></div>`
  +(q.status==="lost"?`<div class="card" style="margin-bottom:14px"><h2>Why it was lost</h2><p class="small muted" style="margin-bottom:8px">Check everything that applies.</p><div class="row" style="gap:8px 18px;margin-bottom:12px">${(S.settings.lostReasons||DEFAULTS.lostReasons).concat(lostList(q).filter(x=>!(S.settings.lostReasons||DEFAULTS.lostReasons).includes(x))).map(r=>`<label class="row small" style="font-weight:600"><input type="checkbox" data-act="lostTog" data-r="${esc(r)}"${lostList(q).includes(r)?" checked":""}> ${esc(r)}</label>`).join("")}</div><label class="f" style="margin-bottom:12px"><span>Other reason (in their words)</span><input type="text" data-bind="lostOther" value="${esc(q.lostOther||"")}" placeholder="Anything not on the list. Reports will flag it if it keeps coming up."></label><div class="grid3"><label class="f"><span>Follow-up</span><select data-bind="followUp">${opts(["none","scheduled","done"].map(x=>x),q.followUp||"none")}</select></label><label class="f"><span>Lost on</span><input type="text" value="${fmtT(q.decidedAt)}" disabled></label></div>${(!q.followUp||q.followUp==="none")?`<p class="small" style="color:var(--bad);margin-top:8px;font-weight:600">No follow-up yet. A short check-in wins some of these back.</p>`:""}</div>`:"")
  +`<div class="cols"><div class="stack"><div class="card">
    <div class="grid3" style="margin-bottom:12px">
      <label class="f"><span>Job type</span><select data-bind="jobType" data-rerender="1">${opts(S.settings.jobTypes,q.jobType,"Pick a job type")}</select></label>

        </tbody></table></div><div style="margin-top:8px"><button class="btn small" data-act="addLine">+ Add line</button></div><div id="tradeBox">${tradeBanner(q)}</div>`}

/* Quote check (asks Claude) */
function checkCard(q){
  const r=q.review;const busy=S.ui.checking===q.id;
  let body="";
  if(busy)body=`<p class="small muted">Checking the quote against your past ${esc(q.jobType||"")} jobs. This usually takes under a minute.</p><div class="row" style="margin-top:8px"><button class="btn small" data-act="stopCheck">Stop</button></div>`;
  else if(r&&r.data){const d=r.data;const L=(t,a,f)=>a&&a.length?`<h3 style="font-size:16px;margin:12px 0 6px">${t}</h3><div class="att">${a.map(f).join("")}</div>`:"";
    body=`<p class="small muted">Checked ${fmtT(r.at)}${(q.updatedAt||0)-r.at>5000?" · the quote has changed since":""}</p>`

function checkPrompt(q){

Quote data:
${JSON.stringify(data)}`;

/* Calendar */
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function vCalendar(){
  if(!S.ui.calMonth)S.ui.calMonth=todayStr().slice(0,7);
  const [y,m]=S.ui.calMonth.split("-").map(Number);const first=new Date(y,m-1,1);const start=new Date(first);start.setDate(1-first.getDay());
  const td=todayStr();const js=vals(S.jobs);
  const pk=S.ui.calPick||"";const pickQ=pk.startsWith("q:")?S.quotes[pk.slice(2)]:null;const pickJ=!pickQ&&pk?S.jobs[pk]:null;
  const pickQuote=pickQ||(pickJ&&S.quotes[pickJ.quoteId]);const pickCust=pickQuote&&S.customers[pickQuote.customerId];
  const propOf=q=>{const c=S.customers[q&&q.customerId]||{};return (c.properties||[]).find(p=>p.id===(q&&q.propertyId))||(c.properties||[])[0]||{}};
  const byDay={};js.filter(j=>j.scheduledDate).forEach(j=>jobDays(j).forEach(k=>{(byDay[k]=byDay[k]||[]).push(j)}));
  const matDay={};vals(S.quotes).filter(q=>q.status==="won"&&!(S.jobs[q.id]&&S.jobs[q.id].completed)).forEach(q=>((q.internal&&q.internal.materials)||[]).forEach(mt=>{if(mt.eta){(matDay[mt.eta]=matDay[mt.eta]||[]);if(!matDay[mt.eta].some(x=>x.q===q))matDay[mt.eta].push({q})}}));
  const visDay={};vals(S.leads).filter(l=>leadSt(l)==="scheduled"&&l.visitDate).forEach(l=>{(visDay[l.visitDate]=visDay[l.visitDate]||[]).push(l)});
  const cells=[];for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);cells.push(d)}
  const weeks=cells[35].getMonth()!==m-1?35:42;
  const approvedNoJob=vals(S.quotes).filter(q=>q.status==="won"&&!S.jobs[q.id]).sort((a,b)=>(a.decidedAt||0)-(b.decidedAt||0));
  const jobsNoDate=js.filter(j=>!j.scheduledDate&&!j.completed);
  const hrs=d=>Math.round((byDay[d]||[]).reduce((a,j)=>a+dayHrs(j),0)*10)/10;
  const overP=d=>{const per={};(byDay[d]||[]).forEach(j=>jobCrew(j).forEach(c=>{per[c.id]=(per[c.id]||0)+dayHrs(j)}));return Object.values(per).some(h=>h>8)};
  const pickZip=pickQuote?propOf(pickQuote).zip:"";
  const item=(key,q,j)=>{const c=S.customers[q.customerId];const p=propOf(q);const mats=(q.internal&&q.internal.materials)||[];const eta=latestEta(q);const sel=pk===key;
    return `<div class="att-item ${sel?"good":mats.some(x=>!x.ordered)?"warn":""}"><span class="stripe"></span><div><div class="t">${esc(custName(c))} ${p.zip?`<span class="pill">${esc(p.zip)}</span>`:""}</div><div class="d">${esc(q.jobType||"")}${q.internal&&q.internal.hours?" · "+esc(q.internal.hours)+" hrs":""}<br>${p.town?esc(p.town)+" · ":""}${mats.length?(mats.some(x=>!x.ordered)?'<b style="color:var(--bad)">materials not ordered</b>':eta?"materials arrive "+fmtD(eta):"materials ordered"):"no materials"}${c&&c.blackout?"<br>Away: "+esc(c.blackout):""}</div></div><button class="btn small ${sel?"primary":""}" data-act="calPick" data-id="${esc(key)}">${sel?"Picking…":"Schedule"}</button></div>`};
  return head(first.toLocaleDateString("en-US",{month:"long",year:"numeric"}),"Calendar",`<button class="btn" data-act="calPrev" aria-label="Previous month">‹</button><button class="btn" data-act="calToday">Today</button><button class="btn" data-act="calNext" aria-label="Next month">›</button>`)
  +(pickQuote?`<div class="banner" style="background:var(--accent-soft);color:var(--accent);border-color:transparent"><span class="spread"><span>Scheduling ${esc(custName(pickCust))}${pickZip?" ("+esc(pickZip)+")":""}: click a day.${latestEta(pickQuote)?" Materials arrive "+fmtD(latestEta(pickQuote))+".":""}${pickZip?" Days with other jobs in "+esc(pickZip)+" are outlined.":""}</span><button class="btn small" data-act="calCancel">Cancel</button></span></div>`:"")
  +`<div class="cols" style="grid-template-columns:minmax(0,3fr) minmax(0,1fr)"><div><div class="cal">${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(d=>`<div class="cal-h">${d}</div>`).join("")}
    ${cells.slice(0,weeks).map(d=>{const k=ymd(d);const list=byDay[k]||[];const h=hrs(k);const out=d.getMonth()!==m-1;
      const sameZip=pickZip&&list.some(j=>propOf(S.quotes[j.quoteId]).zip===pickZip);const eta=pickQuote&&latestEta(pickQuote);const early=pickQuote&&eta&&k<=eta;
      return `<div class="cal-d${out?" out":""}${k===td?" today":""}${pickQuote?" pickable":""}${sameZip?" samezip":""}${early?" early":""}" ${pickQuote?`data-act="calPlace" data-d="${k}" role="button" tabindex="0" aria-label="Schedule on ${fmtD(k)}"`:""}><div class="cal-n"><span>${d.getDate()}</span>${h?`<span class="cal-hrs${overP(k)?" over":""}">${h} hrs</span>`:""}</div>
      ${(visDay[k]||[]).map(l=>{const z=leadProp(l).zip;return `<button class="cal-j est" data-act="go" data-view="lead" data-id="${l.id}" title="Estimate visit">${esc(custName(S.customers[l.customerId]))}<span>Estimate${l.visitTime?" · "+esc(l.visitTime):""}${z?" · "+esc(z):""}</span></button>`}).join("")}
      ${(matDay[k]||[]).map(x=>`<div class="cal-m" title="Materials arriving">Materials: ${esc(custName(S.customers[x.q.customerId]))}</div>`).join("")}
      ${list.sort((a,b)=>(a.startTime||"99").localeCompare(b.startTime||"99")).map(j=>{const c=S.customers[j.customerId];const q=S.quotes[j.quoteId]||{};const z=propOf(q).zip;const cls=j.completed?"done":j.confirmed?"ok":"tbc";const cr=jobCrew(j);const ds=jobDays(j);const di=ds.indexOf(k);
        return `<button class="cal-j ${cls}" style="border-left-color:${esc(cr[0].color)}" data-act="go" data-view="job" data-id="${j.id}" title="${esc(custName(c)+" · "+(q.jobType||"")+(z?" · "+z:"")+" · "+cr.map(x=>x.name).join(", "))}">${cr.length>1?cr.slice(1).map(x=>`<i class="lg" style="background:${esc(x.color)};float:right;margin:3px 0 0 2px"></i>`).join(""):""}${esc(custName(c))}<span>${j.startTime?tmS(j.startTime)+"–"+tmS(j.endTime)+" · ":""}${ds.length>1?"Day "+(di+1)+"/"+ds.length+" · ":""}${z?esc(z):esc(q.jobType||"")}</span></button>`}).join("")}</div>`}).join("")}
  </div><div class="row small muted" style="margin-top:8px;gap:14px"><span><i class="lg ok"></i> Appointment sent</span><span><i class="lg tbc"></i> Not sent yet</span><span><i class="lg done"></i> Complete</span><span><i class="lg mat"></i> Materials arriving</span><span><i class="lg est"></i> Estimate visit</span><span>Over 8 hours for one person shows in red.</span>${crewList().map(c=>`<span><i class="lg" style="background:${esc(c.color)};border-radius:50%"></i> ${esc(c.name)}</span>`).join("")}</div></div>
  <div class="stack"><div class="card"><h2>Needs a date <span class="pill">${approvedNoJob.length+jobsNoDate.length}</span></h2>${approvedNoJob.length||jobsNoDate.length?`<div class="att">${approvedNoJob.map(q=>item("q:"+q.id,q,null)).join("")}${jobsNoDate.map(j=>item(j.id,S.quotes[j.quoteId]||{},j)).join("")}</div>`:`<p class="small muted">Nothing waiting. Approved quotes show up here.</p>`}</div>
  <div class="card"><h2>How it works</h2><p class="small muted">Approved quotes wait here. Check the zip code and when materials arrive, click Schedule, then click a day. Pick the times, the last day if it runs more than one day, and who's on it. That creates the job and blocks out every day. Days already booked in the same zip are outlined, and days before the materials arrive are shaded. Then open the job and send the appointment by text and email.</p></div></div></div>`;
}

function findDupes(f){

  if(!ph&&!em&&nm.length<4&&addr.length<6&&(f.company||"").trim().length<4)return [];
  return vals(S.customers).map(c=>{const why=[];
    if(ph.length>=7&&digits(c.phone).endsWith(ph.slice(-7)))why.push("same phone");
    if(em&&(c.email||"").toLowerCase()===em)why.push("same email");
    if(nm.length>=4&&custName(c).toLowerCase()===nm)why.push("same name");

}

function rangeBounds(r){const now=new Date();let start,end=now.getTime();
  if(r==="all")return {start:0,end,pStart:0,pEnd:0,all:true};
  if(r==="custom"){const f=S.ui.from?parseD(S.ui.from):null,t=S.ui.to?parseD(S.ui.to):null;start=f?f.getTime():0;if(t){t.setDate(t.getDate()+1);end=t.getTime()-1}const len=end-start;return {start,end,pStart:start?start-len:0,pEnd:start||0}}
  if(r==="mtd")start=new Date(now.getFullYear(),now.getMonth(),1);else if(r==="ytd")start=new Date(now.getFullYear(),0,1);else{start=new Date();start.setHours(0,0,0,0);start.setDate(start.getDate()-(+r))}const len=now-start;return {start:start.getTime(),end,pStart:start.getTime()-len,pEnd:start.getTime()}}
function rangeLabel(){const r=S.ui.range;return {mtd:"month to date","30":"last 30 days","90":"last 90 days",ytd:"year to date","365":"last 12 months",all:"all time",custom:(S.ui.from?fmtD(S.ui.from):"the start")+" to "+(S.ui.to?fmtD(S.ui.to):"today")}[r]||""}

  return `<div class="row" style="margin-bottom:16px;gap:10px"><div class="seg" role="group" aria-label="Date range">${rb("mtd","Month")}${rb("30","30 days")}${rb("90","90 days")}${rb("ytd","Year to date")}${rb("365","12 months")}${rb("all","All time")}${rb("custom","Pick dates")}</div>
  ${r==="custom"?`<label class="row small" style="gap:6px">From <input type="date" data-ib="from" value="${esc(S.ui.from||"")}" style="width:170px"></label><label class="row small" style="gap:6px">To <input type="date" data-ib="to" value="${esc(S.ui.to||"")}" style="width:170px"></label>`:""}</div>`}
const BANDS=[[0,250,"Under $250"],[250,500,"$250–499"],[500,1000,"$500–999"],[1000,2500,"$1,000–2,499"],[2500,1e12,"$2,500+"]];
function approvalStats(b){
  const qs=vals(S.quotes).filter(q=>q.sentAt&&!q.onsite&&(!b||inRange(q.sentAt,b)));
  const days=q=>(q.decidedAt-q.sentAt)/864e5;
  const won=qs.filter(q=>q.status==="won"&&q.decidedAt),lost=qs.filter(q=>q.status==="lost"&&q.decidedAt),open=qs.filter(q=>q.status==="sent");
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
  const med=a=>{if(!a.length)return null;const b=a.slice().sort((x,y)=>x-y);const m=Math.floor(b.length/2);return b.length%2?b[m]:(b[m-1]+b[m])/2};
  const wd=won.map(days);
  const bands=BANDS.map(([lo,hi,l])=>{const inB=q=>{const p=qTotals(q).price;return p>=lo&&p<hi};const w=won.filter(inB),lo2=lost.filter(inB),o=open.filter(inB);
    const pr=w.reduce((a,q)=>a+qTotals(q).profit,0),rv=w.reduce((a,q)=>a+qTotals(q).price,0),hr=w.reduce((a,q)=>a+hrsOf(q),0);
    return {l,won:w.length,lost:lo2.length,open:o.length,rate:w.length+lo2.length?w.length/(w.length+lo2.length)*100:null,days:avg(w.map(days)),priceLost:lo2.filter(q=>lostList(q).includes("Price")).length,margin:rv?pr/rv*100:null,perHr:hr?pr/hr:null}}).filter(x=>x.won+x.lost+x.open);
  return {won,lost,open,avgWon:avg(wd),medWon:med(wd),avgLost:avg(lost.map(days)),avgOpen:avg(open.map(q=>(Date.now()-q.sentAt)/864e5)),bands,wonPrice:avg(won.map(q=>qTotals(q).price)),lostPrice:avg(lost.map(q=>qTotals(q).price)),pricedOut:lost.filter(q=>lostList(q).includes("Price"))};
}
const dd=x=>x==null?"—":(Math.round(x*10)/10)+" day"+(Math.round(x*10)/10===1?"":"s");
function approvalCard(){

    if(lo.rate!=null&&hi.rate!=null&&Math.abs(lo.rate-hi.rate)>=15)notes.push(`${hi.rate<lo.rate?"Bigger":"Smaller"} quotes are approved less often: ${pct(lo.rate)} for ${lo.l} vs ${pct(hi.rate)} for ${hi.l}.`);

    </div>

    <div class="att" style="margin-top:12px">${notes.map(n=>`<div class="att-item warn"><span class="stripe"></span><div><div class="d" style="color:var(--ink)">${n}</div></div></div>`).join("")}</div>
    <p class="small muted" style="margin-top:8px">Counts quotes sent in this date range. Jobs priced on site aren't included. Margin and profit per hour use approved quotes and Seth's hour estimates.</p></div>`;
}
function lostCard(){
  const lost=vals(S.quotes).filter(q=>q.status==="lost");
  if(!lost.length)return `<div class="card"><h2>Why quotes are lost</h2><div class="empty">No lost quotes yet.</div></div>`;
  const rb=rangeBounds(S.ui.range);const boxes=S.settings.lostReasons||DEFAULTS.lostReasons;
  const cnt={};lost.forEach(q=>lostList(q).forEach(r=>{cnt[r]=cnt[r]||{all:0,recent:0,val:0};cnt[r].all++;if(inRange(q.decidedAt,rb))cnt[r].recent++;cnt[r].val+=qTotals(q).price}));
  const rows=Object.entries(cnt).sort((a,b)=>b[1].all-a[1].all);const max=Math.max(1,...rows.map(r=>r[1].all));
  const none=lost.filter(q=>!lostList(q).length&&!q.lostOther).length;
  const grp={};lost.filter(q=>q.lostOther).forEach(q=>{const k=normOther(q.lostOther);if(!k)return;grp[k]=grp[k]||{text:q.lostOther,n:0,recent:0,qs:[]};grp[k].n++;if(inRange(q.decidedAt,rb))grp[k].recent++;grp[k].qs.push(q)});
  const TC=+S.settings.trendCount||2,TD=+S.settings.trendDays||90;
  Object.values(grp).forEach(g=>{const ts=g.qs.map(q=>q.decidedAt||q.updatedAt||0).sort((a,b)=>a-b);g.trend=false;for(let i=0;i+TC-1<ts.length;i++)if(ts[i+TC-1]-ts[i]<=TD*864e5){g.trend=true;break}});
  const others=Object.values(grp).sort((a,b)=>(b.trend-a.trend)||b.n-a.n);
  return `<div class="card"><h2>Why quotes are lost</h2>
    ${rows.length?`<div class="stack" style="gap:8px">${rows.map(([r,v])=>`<div class="hbar"><span>${esc(r)}${boxes.includes(r)?"":' <span class="pill gray">old</span>'}</span><div class="track"><i style="width:${v.all/max*100}%;background:var(--mid)"></i></div><span class="num small" style="text-align:right"><b>${v.all}</b> all time<br><span class="muted">${v.recent} in ${esc(rangeLabel())} · ${money(v.val)}</span></span></div>`).join("")}</div>`:""}
    ${none?`<p class="small" style="color:var(--bad);font-weight:600;margin-top:10px">${none} lost quote${none>1?"s have":" has"} no reason checked.</p>`:""}
    <h3 style="margin:16px 0 6px">Other reasons written in</h3>
    ${others.length?`<div class="att">${others.map(o=>`<div class="att-item ${o.trend?"bad":""}"><span class="stripe"></span><div><div class="t">“${esc(o.text)}” ${o.trend?'<span class="pill lost">Trend</span>':""}</div><div class="d">${o.n} time${o.n>1?"s":""}${o.recent?" · "+o.recent+" in "+esc(rangeLabel()):""} · ${o.qs.map(q=>esc(custName(S.customers[q.customerId]))).join(", ")}</div></div>${o.trend&&!boxes.includes(o.text)?`<button class="btn small" data-act="addLostReason" data-r="${esc(o.text)}">Make it a checkbox</button>`:""}</div>`).join("")}</div>
      <p class="small muted" style="margin-top:8px">A written-in reason is marked as a trend when it comes up ${TC} times within ${TD} days. Similar wording counts as the same reason. Change the rule in Settings.</p>`:`<p class="small muted">None yet. Anything typed in the "Other reason" box on a lost quote shows up here, and repeats get flagged.</p>`}
  </div>`;
}
function propOfQ(q){const c=S.customers[q&&q.customerId]||{};return (c.properties||[]).find(p=>p.id===(q&&q.propertyId))||(c.properties||[])[0]||{}}
function zipRows(b){
  const by={};const ok=t=>!b||inRange(t,b);const g=(zip,town)=>{const k=zip||"No zip";by[k]=by[k]||{zip:k,towns:{},leads:0,quotes:0,won:0,lost:0,rev:0,done:0};if(town)by[k].towns[town]=1;return by[k]};
  vals(S.leads).filter(l=>ok(l.createdAt)).forEach(l=>{const p=leadProp(l);g(p.zip,p.town).leads++});
  vals(S.quotes).filter(q=>ok(q.createdAt)).forEach(q=>{const p=propOfQ(q);const r=g(p.zip,p.town);if(q.status!=="lead"||q.onsite)r.quotes++;if(q.status==="won"){r.won++;r.rev+=qTotals(q).price}if(q.status==="lost")r.lost++;const j=S.jobs[q.id];if(j&&j.completed)r.done++});
  return Object.values(by).map(r=>Object.assign(r,{rate:r.won+r.lost?r.won/(r.won+r.lost)*100:null,conv:r.leads?Math.min(100,r.won/r.leads*100):null,avg:r.won?r.rev/r.won:0,town:Object.keys(r.towns).join(", ")})).sort((a,b)=>b.rev-a.rev);

function jobAverages(){
  const by={};vals(S.quotes).forEach(q=>{const k=q.jobType||"No job type";by[k]=by[k]||{won:[],lost:0,sent:0};if(q.status==="won")by[k].won.push(q);else if(q.status==="lost")by[k].lost++;else if(q.status==="sent")by[k].sent++});
  return Object.entries(by).map(([k,v])=>{const t=v.won.map(qTotals);const n=v.won.length;const sum=f=>t.reduce((a,x)=>a+x[f],0);
    const hrs=v.won.map(q=>+(q.internal&&q.internal.hours)||0).filter(Boolean);
    const days=v.won.map(q=>q.sentAt&&q.decidedAt?(q.decidedAt-q.sentAt)/864e5:null).filter(x=>x!=null);
    return {k,n,lost:v.lost,open:v.sent,avgPrice:n?sum("price")/n:0,avgHours:hrs.length?hrs.reduce((a,b)=>a+b,0)/hrs.length:0,avgMargin:sum("price")?sum("profit")/sum("price")*100:0,winRate:n+v.lost?n/(n+v.lost)*100:null,perHour:hrs.length?v.won.reduce((a,q)=>a+qTotals(q).price,0)/hrs.reduce((a,b)=>a+b,0):0,daysToDecide:days.length?days.reduce((a,b)=>a+b,0)/days.length:null}}).sort((a,b)=>b.n-a.n);
}

function quoteText(q){
  const c=S.customers[q.customerId]||{};const t=qTotals(q);const L=[];
  L.push(`Hi ${firstName(c)}, here's your quote from ${S.settings.company}${q.quoteNo?" (Quote "+q.quoteNo+")":""}:`,"");
  if(q.mode==="flat")L.push(`${q.flatScope||q.jobType||"Work as discussed"}: ${money2(t.price)}`);
  else (q.lines||[]).filter(l=>!l.removed&&(l.desc||l.price)).forEach((l,n,arr)=>{L.push(`${arr.length>1?(n+1)+". ":"• "}${l.desc||"Item"}${(+l.qty||0)!==1?" ("+l.qty+" × "+money2(l.price)+")":""}: ${money2((+l.qty||0)*(+l.price||0))}`)});
  L.push("",`Total: ${money2(t.price)}`,`Deposit to schedule (${t.dep}%): ${money2(t.deposit)}`);

function newQuote(customerId,propertyId,extra){

  put("quotes",id,q,{quiet:true});return id;
}
function lostList(q){if(q.lostReasons)return q.lostReasons.slice();if(!q.lostReason||q.lostReason==="Other")return [];return String(q.lostReason).split(", ").filter(Boolean)}
function lostSummary(q){return lostList(q).concat(q.lostOther?[q.lostOther]:[]).join(", ")}
const normOther=t=>String(t||"").toLowerCase().replace(/[^a-z0-9 ]/g," ").replace(/\b(the|a|an|to|for|on|of|they|their|it|was|is)\b/g," ").replace(/\s+/g," ").trim();
const LEAD_ST={new:"New",scheduled:"Scheduled",converted:"Converted",closed:"Closed"};
const LEAD_CLOSE=["No response","Not our kind of work","Outside service area","Went with someone else","Duplicate","Other"];
function leadSt(l){if(!l)return "new";if(l.status==="converted"&&l.quoteId&&!S.quotes[l.quoteId])return l.visitDate?"scheduled":"new";return l.status||"new"}
function leadConvert(lid,kind){
  flush();const l=clone(S.leads[lid]);if(!l)return;const now=Date.now();
  const req=(l.request||"")+(l.timing?"\nTiming: "+l.timing:"");
  if(kind==="quote"){
    const qid=newQuote(l.customerId,l.propertyId,{jobType:l.jobType,request:req,leadId:lid});
    Object.assign(l,{status:"converted",convertedTo:"quote",quoteId:qid,convertedAt:now,updatedAt:now});put("leads",lid,l,{quiet:true});
    toast("Quote started");go("quote",qid);
  }else{
    const qid=newQuote(l.customerId,l.propertyId,{jobType:l.jobType,request:req,leadId:lid,status:"won",onsite:true,decidedAt:now});
    ensureJob(S.quotes[qid]);
    Object.assign(l,{status:"converted",convertedTo:"job",quoteId:qid,convertedAt:now,updatedAt:now});put("leads",lid,l,{quiet:true});
    toast("Job created. Add the price Seth gave on the quote.");go("job",qid);
  }
}
function visitText(l){const c=S.customers[l.customerId]||{};const p=(c.properties||[]).find(x=>x.id===l.propertyId)||{};
  return `Hi ${firstName(c)}, this is ${S.settings.company}. Seth will come by ${addrLine(p)||"your place"} on ${fmtD(l.visitDate)}${l.visitTime?" around "+l.visitTime:""} to look at your ${(l.jobType||"project").toLowerCase()} and put together a quote (Lead ${l.leadNo||""}).\n\nIf this time doesn't work for you, please call the office at ${S.settings.phone} and we'll change it.\n\nThank you!`}
function ensureJob(q,extra){
  if(S.jobs[q.id]){if(extra){const n=Object.assign(clone(S.jobs[q.id]),extra);put("jobs",q.id,n,{quiet:true})}return}
  put("jobs",q.id,Object.assign({id:q.id,jobNo:nextNo("job"),quoteId:q.id,customerId:q.customerId,createdAt:Date.now(),noMaterials:!((q.internal&&q.internal.materials)||[]).length,scheduledDate:"",confirmed:false,completed:false,completedAt:"",invoiced:false,reviewRequested:false,notes:"",sample:!!q.sample},q.deposit?{depositPaid:true,depositAmt:q.deposit.amt,depositDate:q.deposit.date,depositMethod:q.deposit.how}:{},extra||{}),{quiet:true});
}
